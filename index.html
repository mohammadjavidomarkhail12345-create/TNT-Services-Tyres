<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><link rel="manifest" href="/manifest.webmanifest"><title>TNT Services & Tyres</title><style>
:root{--o:#f58220;--p:#1b1b1b;--m:#aaa}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#0d0d0d;color:#fff}header{background:#151515;border-bottom:3px solid var(--o);padding:13px 16px;position:sticky;top:0}.head{max-width:1100px;margin:auto;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.brand{font-size:23px;font-weight:950;color:var(--o)}.contact{font-size:12px;color:#ddd}main{max-width:1100px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#222,#141414);border:1px solid #303030;border-radius:18px;padding:20px}h1{margin:0 0 6px;font-size:28px}p{color:var(--m)}.search{display:grid;grid-template-columns:1fr 150px;gap:8px;margin-top:14px}input,select,button{font:inherit;min-height:44px;border-radius:11px;border:1px solid #444;background:#151515;color:#fff;padding:11px}button{font-weight:800}.accent{background:var(--o);color:#111;border-color:var(--o)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}.stat{background:var(--p);border:1px solid #303030;border-radius:13px;padding:12px;text-align:center}.stat b{display:block;color:var(--o);font-size:23px}.g{margin-top:18px}.gt{font-weight:950;color:var(--o);font-size:18px;margin-bottom:8px}.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;background:var(--p);border:1px solid #303030;border-radius:13px;padding:12px;margin-bottom:8px}.size{font-size:18px;font-weight:900}.muted{font-size:12px;color:var(--m)}.stock{font-weight:900}.admin{margin-top:22px;border-top:1px solid #333;padding-top:14px}.panel{display:none;background:#171717;border:1px solid #333;border-radius:14px;padding:12px;margin-top:10px}.panel.on{display:block}.edit{display:grid;grid-template-columns:1fr 90px auto;gap:8px;align-items:center;margin:8px 0}.qty{text-align:center}footer{text-align:center;color:#888;padding:24px;font-size:12px}@media(max-width:620px){.search{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.edit{grid-template-columns:1fr 80px}.edit .actions{grid-column:1/-1}}
</style></head><body><header><div class="head"><div><div class="brand">TNT SERVICES & TYRES</div><div class="contact">745 Ashton Old Rd, Openshaw, Manchester M11 2HB • 07944 411298</div></div><button id="install" class="accent" style="display:none">Install App</button></div></header><main><section class="hero"><h1>Find Your Tyre Size</h1><p>Search our live tyre stock. Customers can view; owner can change quantities.</p><div class="search"><input id="q" placeholder="Search e.g. 205/55 R16"><select id="f"><option value="">All sizes</option><option>15 INCH</option><option>16 INCH</option><option>17 INCH</option><option>18 INCH</option><option>19 INCH</option></select></div></section><section class="stats"><div class="stat"><b id="sizes">0</b>Sizes</div><div class="stat"><b id="total">0</b>Total tyres</div><div class="stat"><b id="matches">0</b>Matches</div></section><div id="list"></div><section class="admin"><button id="owner">Owner Login</button><div id="panel" class="panel"><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="pin" type="password" inputmode="numeric" placeholder="Owner PIN"><button id="login" class="accent">Unlock</button><button id="logout" style="display:none">Lock</button></div><div id="msg" class="muted" style="margin-top:8px"></div></div></section></main><footer>TNT Services & Tyres — Live Tyre Stock</footer><script>
let stock=[],token='',deferred=null;const $=x=>document.getElementById(x);function n(s){return s.toLowerCase().replace(/\s+/g,'').replace(/r/g,'/')}async function load(){const r=await fetch('/api/stock',{cache:'no-store'});stock=await r.json();render()}function render(){const q=n($('q').value),f=$('f').value,a=stock.filter(t=>(!f||t.category===f)&&(!q||n(t.size).includes(q)));$('sizes').textContent=stock.length;$('total').textContent=stock.reduce((x,t)=>x+t.qty,0);$('matches').textContent=a.length;let g={},h='';a.forEach(t=>(g[t.category]??=[]).push(t));Object.keys(g).sort().forEach(c=>{h+=`<section class="g"><div class="gt">${c}</div>`;g[c].forEach(t=>{h+=`<div class="row"><div><div class="size">${t.size}</div><div class="muted">${t.size.endsWith('C')?'Van / Commercial':'Passenger tyre'}</div></div><div class="stock">${t.qty>0?t.qty+' in stock':'Out of stock'}</div></div>`;if(token)h+=`<div class="panel on"><div class="edit"><div><b>${t.size}</b><div class="muted">Owner quantity</div></div><input class="qty" type="number" min="0" value="${t.qty}" data-id="${t.id}"><div class="actions"><button class="minus" data-id="${t.id}">−1</button> <button class="plus accent" data-id="${t.id}">+1</button></div></div></div>`});h+='</section>'});$('list').innerHTML=h||'<section class="hero"><b>No matching size found.</b></section>';bind()}function bind(){document.querySelectorAll('.qty').forEach(e=>e.addEventListener('change',()=>setQty(+e.dataset.id,+e.value)));document.querySelectorAll('.minus').forEach(e=>e.addEventListener('click',()=>{const t=stock.find(x=>x.id==e.dataset.id);setQty(t.id,Math.max(0,t.qty-1))}));document.querySelectorAll('.plus').forEach(e=>e.addEventListener('click',()=>{const t=stock.find(x=>x.id==e.dataset.id);setQty(t.id,t.qty+1)}))}async function setQty(id,qty){await fetch('/api/stock/'+id,{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({qty:Math.max(0,Math.floor(Number(qty)||0))})});await load()}$('q').addEventListener('input',render);$('f').addEventListener('change',render);$('owner').addEventListener('click',()=>$('panel').classList.toggle('on'));$('login').addEventListener('click',async()=>{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:$('pin').value})});const d=await r.json();if(d.ok){token=d.token;$('msg').textContent='Owner mode unlocked';$('logout').style.display='inline-block';render()}else $('msg').textContent='Wrong PIN'});$('logout').addEventListener('click',()=>{token='';$('pin').value='';$('msg').textContent='Owner mode locked';$('logout').style.display='none';render()});window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('install').style.display='inline-block'});$('install').addEventListener('click',async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;$('install').style.display='none'}});load();setInterval(load,15000);if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
</script></body></html>
