<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><link rel="manifest" href="/manifest.webmanifest"><title>TNT Services & Tyres</title><style>
:root{--o:#f58220;--p:#1b1b1b;--m:#aaa}*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#0d0d0d;color:#fff}header{background:#151515;border-bottom:3px solid var(--o);padding:14px;position:sticky;top:0}.wrap{max-width:1050px;margin:auto;padding:16px}.brand{font-weight:950;font-size:23px;color:var(--o)}.sub{font-size:12px;color:#ddd}.hero,.panel,.card{background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:16px}.search{display:grid;grid-template-columns:1fr 150px;gap:8px;margin-top:12px}input,select,button{font:inherit;padding:11px;border-radius:10px;border:1px solid #444;background:#151515;color:#fff}button{font-weight:800}.accent{background:var(--o);color:#111}.danger{background:#431b1b}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat{text-align:center;background:#1a1a1a;border:1px solid #333;border-radius:13px;padding:12px}.stat b{display:block;color:var(--o);font-size:23px}.gt{font-weight:950;color:var(--o);margin:18px 0 8px}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:12px;margin-bottom:8px}.size{font-size:18px;font-weight:900}.muted{font-size:12px;color:var(--m)}.adminedit{display:grid;grid-template-columns:1fr 90px auto;gap:8px;margin:-2px 0 10px;padding:10px;background:#141414;border-radius:10px}.panel{display:none;margin-top:14px}.panel.on{display:block}.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:18px}.modal.on{display:flex}.modal .card{width:min(500px,100%)}@media(max-width:620px){.search{grid-template-columns:1fr}.adminedit{grid-template-columns:1fr 80px}.actions{grid-column:1/-1}}</style></head><body>
<header><div class="brand">TNT SERVICES & TYRES</div><div class="sub">745 Ashton Old Rd, Openshaw, Manchester M11 2HB • 07944 411298</div></header><div class="wrap"><div class="hero"><h1>Find Your Tyre Size</h1><div class="muted">Customers search and view stock. Only the owner can edit.</div><div class="search"><input id="q" placeholder="Search e.g. 205/55 R16"><select id="f"><option value="">All sizes</option><option>15 INCH</option><option>16 INCH</option><option>17 INCH</option><option>18 INCH</option><option>19 INCH</option><option>20 INCH</option><option>21 INCH</option><option>22 INCH</option></select></div></div><div class="stats"><div class="stat"><b id="sizes">0</b>Sizes</div><div class="stat"><b id="total">0</b>Total tyres</div><div class="stat"><b id="matches">0</b>Matches</div></div><div id="list"></div><button id="owner">Owner Login</button><div id="panel" class="panel"><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="pin" type="password" placeholder="Owner PIN"><button id="login" class="accent">Unlock</button><button id="logout" style="display:none">Lock</button></div><div id="msg" class="muted"></div><button id="add" class="accent" style="display:none;margin-top:10px">+ Add New Tyre Size</button></div></div>
<div id="modal" class="modal"><div class="card"><h2>Add New Tyre Size</h2><div style="display:grid;gap:8px"><select id="newcat"><option>15 INCH</option><option>16 INCH</option><option>17 INCH</option><option>18 INCH</option><option>19 INCH</option><option>20 INCH</option><option>21 INCH</option><option>22 INCH</option></select><input id="newsize" placeholder="205/65 R16C"><input id="newqty" type="number" min="0" value="0"><div><button id="save" class="accent">Save</button> <button id="cancel">Cancel</button></div><div id="newmsg" class="muted"></div></div></div></div>
<script>let stock=[],token='';const $=x=>document.getElementById(x),norm=s=>s.toLowerCase().replace(/\s+/g,'').replace(/r/g,'/');async function load(){stock=await (await fetch('/api/stock',{cache:'no-store'})).json();render()}function render(){const q=norm($('q').value),f=$('f').value,a=stock.filter(t=>(!f||t.category===f)&&(!q||norm(t.size).includes(q)));$('sizes').textContent=stock.length;$('total').textContent=stock.reduce((x,t)=>x+t.qty,0);$('matches').textContent=a.length;let g={},h='';a.forEach(t=>(g[t.category]??=[]).push(t));Object.keys(g).sort().forEach(c=>{h+=`<div class="gt">${c}</div>`;g[c].forEach(t=>{h+=`<div class="row"><div><div class="size">${t.size}</div><div class="muted">${t.size.endsWith('C')?'Van / Commercial':'Passenger tyre'}</div></div><b>${t.qty>0?t.qty+' in stock':'Out of stock'}</b></div>`;if(token)h+=`<div class="adminedit"><b>${t.size}</b><input class="qty" type="number" min="0" value="${t.qty}" data-id="${t.id}"><div class="actions"><button class="minus" data-id="${t.id}">−1</button> <button class="plus accent" data-id="${t.id}">+1</button> <button class="del danger" data-id="${t.id}" data-size="${t.size}">Delete</button></div></div>`})});$('list').innerHTML=h||'<div class="hero">No matching size found.</div>';bind()}function bind(){document.querySelectorAll('.qty').forEach(e=>e.onchange=()=>setQty(+e.dataset.id,+e.value));document.querySelectorAll('.minus').forEach(e=>e.onclick=()=>{let t=stock.find(x=>x.id==e.dataset.id);setQty(t.id,Math.max(0,t.qty-1))});document.querySelectorAll('.plus').forEach(e=>e.onclick=()=>{let t=stock.find(x=>x.id==e.dataset.id);setQty(t.id,t.qty+1)});document.querySelectorAll('.del').forEach(e=>e.onclick=()=>del(+e.dataset.id,e.dataset.size))}async function setQty(id,qty){await fetch('/api/stock/'+id,{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({qty})});load()}async function del(id,size){if(!confirm('Delete '+size+'?'))return;await fetch('/api/stock/'+id,{method:'DELETE',headers:{Authorization:'Bearer '+token}});load()}$('q').oninput=render;$('f').onchange=render;$('owner').onclick=()=>$('panel').classList.toggle('on');$('login').onclick=async()=>{let d=await (await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:$('pin').value})})).json();if(d.ok){token=d.token;$('msg').textContent='Owner mode unlocked';$('logout').style.display='inline-block';$('add').style.display='inline-block';render()}else $('msg').textContent='Wrong PIN'};$('logout').onclick=()=>{token='';$('add').style.display='none';$('logout').style.display='none';render()};$('add').onclick=()=>$('modal').classList.add('on');$('cancel').onclick=()=>$('modal').classList.remove('on');$('save').onclick=async()=>{let d=await (await fetch('/api/stock',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({category:$('newcat').value,size:$('newsize').value,qty:+$('newqty').value||0})})).json();if(d.ok){$('modal').classList.remove('on');$('newsize').value='';$('newqty').value=0;load()}else $('newmsg').textContent=d.error||'Could not add'};load();setInterval(load,15000);</script></body></html>
